name: NEPSE daily data

on:
  schedule:
    - cron: '15 10 * * 1-5'   # 10:15 UTC = 4:00 PM NPT, Monday–Friday
    - cron: '0 11 * * 1-5'    # 11:00 UTC = 4:45 PM NPT retry (skips itself if already updated)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update (first run, weekend, or holiday)'
        type: boolean
        default: false
  push:
    branches: [main]          # your own edits to index.html redeploy immediately

# Least privilege: nothing by default; each job asks for what it needs
permissions: {}

concurrency:
  group: nepse-daily
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write         # commit the day's data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Unit tests (parsers, sanity checks, RRG maths, server rules)
        run: python -m unittest discover -s tests -v

      - name: Daily update (fetch → heatmap/RRG → verify vs previous session → validate)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_daily.py ${{ inputs.force && '--force' || '' }}

      - name: Commit new data
        run: |
          git config user.name  "nepse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: NEPSE close $(python -c "import json;print(json.load(open('data/latest.json'))['trade_date'])")"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: update-data
    # GitHub Pages: free for public repos (paid plans for private). Set the repository
    # variable PAGES_ENABLED=true (Settings → Secrets and variables → Actions →
    # Variables) once Pages is switched on; until then this job is skipped.
    if: ${{ !cancelled() && needs.update-data.result != 'failure' && vars.PAGES_ENABLED == 'true' }}
    # WARNING: a Pages site is public to anyone with the link and has no login —
    # it publishes the dashboard and all market data (see DEPLOYMENT.md).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Only what the page loads: index.html + data/ (never scripts/, docs/, .claude/, logs)
      - name: Stage the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/
          rm -f _site/data/live.json _site/data/live_views.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
