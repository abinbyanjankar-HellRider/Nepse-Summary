name: NEPSE daily data

on:
  schedule:
    - cron: '15 10 * * 1-5'   # 10:15 UTC = 4:00 PM NPT, Monday–Friday
    - cron: '0 11 * * 1-5'    # 11:00 UTC = 4:45 PM NPT retry (skips itself if already updated)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update (first run, weekend, or holiday)'
        type: boolean
        default: false
  push:
    branches: [main]          # your own edits to index.html redeploy immediately

# Least privilege: nothing by default; each job asks for what it needs
permissions: {}

concurrency:
  group: nepse-daily
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write         # commit the day's data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Unit tests (parsers, sanity checks, RRG maths, server rules)
        run: python -m unittest discover -s tests -v

      - name: Daily update (fetch → heatmap/RRG → verify vs previous session → validate)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_daily.py ${{ inputs.force && '--force' || '' }}

      - name: Commit new data
        run: |
          git config user.name  "nepse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: NEPSE close $(python -c "import json;print(json.load(open('data/latest.json'))['trade_date'])")"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: update-data
    # Publishes an ENCRYPTED copy (scripts/build_site.py) to a separate public "site"
    # repository whose GitHub Pages serves it: only ciphertext + an unlock page.
    # Skipped until the repository variable SITE_REPO ("owner/name" of that site
    # repo) exists. Needs the secrets SITE_PASSPHRASE and SITE_DEPLOY_TOKEN (a
    # fine-grained token with Contents: read/write on the site repo only).
    # Never uploads plaintext: without both secrets the job fails instead.
    # This repository must be private, otherwise index.html and data/ are public here.
    if: ${{ !cancelled() && needs.update-data.result != 'failure' && vars.SITE_REPO != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SITE_REPO: ${{ vars.SITE_REPO }}
      SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
      SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
    steps:
      - name: Refuse to publish unprotected
        run: |
          [ -n "$SITE_PASSPHRASE" ]   || { echo "::error::Secret SITE_PASSPHRASE is not set - refusing to publish"; exit 1; }
          [ -n "$SITE_DEPLOY_TOKEN" ] || { echo "::error::Secret SITE_DEPLOY_TOKEN is not set - cannot publish"; exit 1; }
          [ "$SITE_REPO" != "$GITHUB_REPOSITORY" ] || { echo "::error::SITE_REPO must be a different repository from this one"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements-site.txt

      - name: Encrypt the site
        run: python scripts/build_site.py --out _site

      - name: Publish the ciphertext to the site repository
        run: |
          cd _site
          git init -q -b main
          git config user.name  "nepse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: encrypted build $(date -u +%F)"
          AUTH=$(printf 'x-access-token:%s' "$SITE_DEPLOY_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          # one orphan commit each time: the ciphertext changes daily, so history would only grow
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              push --force "https://github.com/${SITE_REPO}.git" main
