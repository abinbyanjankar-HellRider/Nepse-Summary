name: NEPSE daily data

on:
  schedule:
    - cron: '15 10 * * 1-5'   # 10:15 UTC = 4:00 PM NPT, Monday–Friday
    - cron: '0 11 * * 1-5'    # 11:00 UTC = 4:45 PM NPT retry (skips itself if already updated)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update (first run, weekend, or holiday)'
        type: boolean
        default: false
  push:
    branches: [main]          # your own edits to index.html redeploy immediately

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nepse-daily
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Daily update (fetch → heatmap/RRG → verify vs previous session → validate)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_daily.py ${{ inputs.force && '--force' || '' }}

      - name: Commit new data
        run: |
          git config user.name  "nepse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: NEPSE close $(TZ=Asia/Kathmandu date +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: update-data
    if: ${{ !cancelled() && needs.update-data.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
